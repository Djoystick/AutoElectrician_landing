<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" fill="none" class="w-auto h-full">
  <defs>
    <linearGradient id="logo-hex-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="logo-trace-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#38bdf8" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Outer Hexagon -->
  <polygon points="50,4 94,28 94,80 50,104 6,80 6,28" 
           stroke="url(#logo-hex-grad)" stroke-width="5" stroke-linejoin="round" fill="none" filter="url(#logo-glow)"/>
  <polygon points="50,11 88,32 88,76 50,97 12,76 12,32" 
           stroke="rgba(255,255,255,0.1)" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
  <!-- Center Main Trace -->
  <line x1="50" y1="28" x2="50" y2="114" stroke="url(#logo-trace-grad)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Center Node Top -->
  <circle cx="50" cy="24" r="7" stroke="url(#logo-trace-grad)" stroke-width="4" fill="#09090b"/>
  <!-- Center Node Middle -->
  <circle cx="46" cy="46" r="5" stroke="url(#logo-trace-grad)" stroke-width="3" fill="#09090b"/>
  <!-- Left Circuit Branch -->
  <polyline points="23,49 23,54 36,66 36,92" stroke="url(#logo-trace-grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="23" cy="47" r="6" stroke="url(#logo-trace-grad)" stroke-width="3.5" fill="#09090b"/>
  <!-- Right Circuit Branch -->
  <polyline points="77,49 77,54 64,66 64,92" stroke="url(#logo-trace-grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="77" cy="47" r="6" stroke="url(#logo-trace-grad)" stroke-width="3.5" fill="#09090b"/>
</svg>
