openapi: "3.0.0"
info:
  title: autoelectro-gateway
  version: "2.2.0"
paths:
  /:
    x-yc-apigateway-any-method:
      summary: Root landing page
      operationId: getRoot
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: ${FUNCTION_ID}
        service_account_id: ${SERVICE_ACCOUNT_ID}
      responses:
        default:
          description: Response
  /{proxy+}:
    x-yc-apigateway-any-method:
      summary: AutoElectro Express Backend & Landing
      operationId: proxyAll
      parameters:
        - name: proxy
          in: path
          required: false
          schema:
            type: string
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: ${FUNCTION_ID}
        service_account_id: ${SERVICE_ACCOUNT_ID}
      responses:
        default:
          description: Dynamic response
